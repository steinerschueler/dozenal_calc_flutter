name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # analyze_changed.py compares with the base commit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Same version that resolved pubspec.lock; the SDK pins transitive packages.
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed
      - run: python3 -I tool/analyze_changed.py --base "$BASE_COMMIT"
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: flutter test
