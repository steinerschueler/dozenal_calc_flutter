name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Same version that resolved pubspec.lock; the SDK pins transitive packages.
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
