name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Same version that resolved pubspec.lock; the SDK pins transitive packages.
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/coverage_gate.dart
