default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged --redact --no-banner
        pass_filenames: false
        stages: [pre-commit]
      - id: dart-format
        name: dart format
        language: system
        entry: dart format --set-exit-if-changed
        types: [dart]
        stages: [pre-commit]
      - id: flutter-analyze
        name: flutter analyze
        language: system
        entry: flutter analyze
        pass_filenames: false
        files: (\.dart|^pubspec\.yaml|^analysis_options\.yaml)$
        stages: [pre-commit]
      # tool/screenshots follows when the store screenshots are redone (AGENTS.md, «Ausnahmen»).
      - id: ruff-format
        name: ruff format
        language: system
        entry: uvx ruff@0.17.2 format
        files: ^tool/[^/]+\.py$
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        language: system
        entry: uvx ruff@0.17.2 check --fix --select E,F,I,UP,B,C90,PL,BLE,S --line-length 120
        files: ^tool/[^/]+\.py$
        stages: [pre-commit]
      - id: mypy
        name: mypy
        language: system
        entry: uvx mypy@2.4.0 --strict
        files: ^tool/[^/]+\.py$
        stages: [pre-commit]
      - id: flutter-test
        name: flutter test
        language: system
        entry: flutter test --coverage
        pass_filenames: false
        stages: [pre-push]
      - id: coverage-gate
        name: Testabdeckung ohne Oberfläche (CC-22)
        language: system
        entry: dart run tool/coverage_gate.dart
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        stages: [pre-commit]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
