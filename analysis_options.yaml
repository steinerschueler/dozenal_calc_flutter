# Rule set per npf CC-01. Existing code is cleaned up file by file (CC-41): tool/analyze_changed.py
# blocks lint findings only in changed files, so plain `flutter analyze` still lists the old ones.
include: package:very_good_analysis/analysis_options.yaml

# Written by the Flutter tool since 3.47; no Dart sources live in these folders.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
    avoid_catches_without_on_clauses: true
    lines_longer_than_80_chars: false # see docs/decisions/0002
