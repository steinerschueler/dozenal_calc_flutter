name: DozenalWatch
options:
  bundleIdPrefix: app.weltanschauung.dozenal
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

targets:
  DozenalWatch:
    type: application
    platform: watchOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Dozenal
        WKApplication: true
        WKWatchOnly: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.weltanschauung.dozenal.watch
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
